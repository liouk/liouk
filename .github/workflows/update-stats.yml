name: Update Stats

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update stats
        run: ./github-stats.sh --force --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
